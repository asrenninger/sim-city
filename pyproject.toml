[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-city"
version = "0.1.0"
description = "Simulations and null models for urban science"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["urban", "mobility", "simulation", "segregation", "spatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
]
io = [
    "duckdb>=0.9",
    "osmnx>=1.6",
    "census>=0.8",
    "us>=3.0",
]
all = ["sim-city[dev,io]"]

[project.urls]
Homepage = "https://github.com/yourusername/sim-city"
Repository = "https://github.com/yourusername/sim-city"
Issues = "https://github.com/yourusername/sim-city/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_city"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sim_city"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
